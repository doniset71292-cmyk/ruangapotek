<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background putih bulet -->
  <circle cx="50" cy="50" r="48" fill="white"/>
  <!-- Lingkaran teal tipis biar keliatan di tab putih -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#0D9488" stroke-width="3"/>
  <!-- Huruf R -->
  <text x="50" y="68" font-family="system-ui, Arial, sans-serif" font-size="58" font-weight="900" fill="#0D9488" text-anchor="middle">R</text>
  <!-- Titik kecil di bawah R, ciri khas apotek -->
